[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-fuel-unet"
version = "0.1.0"
description = "Multimodal U-Net pipeline for UK FireInSite wildfire fuel classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchgeo",
    "rasterio",
    "geopandas",
    "xarray",
    "rioxarray",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]